services:
  preparar-tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: preparar-tests:local
    container_name: preparar-tests
    environment:
      PUERTO_WEB: 3000
      RUTA_APUNTES: /data/apuntes
      RUTA_BANCOS: /app/datos/bancos
      DIRECCION_OLLAMA: http://generador-apuntes-ollama:11434
      PROVEEDOR_IA: ${PROVEEDOR_IA:-auto}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODELO: ${NVIDIA_MODELO:-meta/llama-3.1-8b-instruct}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      SUPABASE_URL: ${SUPABASE_URL:-https://lztatgnlplpduiatmlrv.supabase.co}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-sb_publishable_z_T7Y3yKqPdXLnvL3ltnQA_ZAPrXImZ}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-nataliagamezbarea/GRADOS_INFORMATICOS}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-Segundo_grado_superior}
      GITHUB_FOLDER: ${GITHUB_FOLDER:-datos/bancos/WEC}
      GH_TOKEN: ${GH_TOKEN:-}
      MODELO_IA: ${MODELO_IA:-qwen2.5vl:7b}
      NUM_CTX_IA: ${NUM_CTX_IA:-24576}
      TOKENS_MAX_IA: ${TOKENS_MAX_IA:-2048}
      TIEMPO_IA: ${TIEMPO_IA:-900}
      MAX_CARACTERES_BLOQUE: ${MAX_CARACTERES_BLOQUE:-10000}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${DIRECTORIO_APUNTES:?Selecciona primero la carpeta de apuntes}:/data/apuntes:ro
      - ../datos/bancos:/app/datos/bancos
      - ../data:/app/data
      - ../public:/app/public
      - ../server:/app/server:ro
    networks:
      - ollama_compartido
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/salud').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 5

networks:
  ollama_compartido:
    external: true
    name: docker_default
